{% extends "base.html" %}

{% block content %}
  <h1>Driver list</h1>
    <ul>
      {% for driver in driver_list %}
        <li><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></li>
      {% empty %}
        <p>No driver found.</p>
      {% endfor %}
    </ul>
{% endblock %}
